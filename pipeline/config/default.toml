# Chirplet configuration: White-crowned Sparrow, all subspecies, US only
# The xeno-canto API key comes only from the XENOCANTO_API_KEY env var.

[paths]
db_path = "data/chirplet.sqlite"

data_dir = "data"
raw_dir = "data/raw"
processed_dir = "data/processed"
cache_dir = "data/cache"

[api]
xc_base_url = "https://xeno-canto.org/api/3/recordings"
xc_request_delay = 3.6                                  # seconds between requests

[species]
target_genus = "Zonotrichia"
target_species = "leucophrys"
target_subspecies = ""           # "" = all subspecies; "nuttalli" for CA coastal only
target_country = "United States" # "" = worldwide

[filtering]
min_quality = "C"
require_coords = true
sound_types = ["song"]

[download]
max_concurrent = 4
